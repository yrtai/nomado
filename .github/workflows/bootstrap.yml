name: Bootstrap project (labels, milestones, Phase 0 issues)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/seed/**']

permissions:
  contents: read
  issues: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seed labels, milestones and issues
        run: node .github/seed/bootstrap.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
